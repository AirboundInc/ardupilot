name: test scripting

on:
  push:
    paths:
      - 'libraries/AP_Scripting/tests/docs_check.py'
      - 'libraries/AP_Scripting/generator/**'
      - '**.lua'
      - 'Tools/autotest/Lte_modem_test.py'

  pull_request:
    paths:
      - 'libraries/AP_Scripting/tests/docs_check.py'
      - 'libraries/AP_Scripting/generator/**'
      - '**.lua'
      - 'Tools/autotest/Lte_modem_test.py'

  workflow_dispatch:

concurrency:
  group: ci-${{github.workflow}}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-scripting:
    runs-on: ubuntu-22.04
    container: ardupilot/ardupilot-dev-base:v0.1.3
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Lua Linter
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get -y install lua-check
          ./Tools/scripts/run_luacheck.sh

      - name: Language server check
        shell: bash
        run: |
          python -m pip install github-release-downloader
          python ./Tools/scripts/run_lua_language_check.py

      - name: Generate docs md
        shell: bash
        run: |
          ./Tools/scripts/generate_lua_docs.sh

      - name: copy docs
        run: |
          PATH="/github/home/.local/bin:$PATH"
          mv "libraries/AP_Scripting/docs/docs.lua" "libraries/AP_Scripting/docs/current_docs.lua"

      - name: build sitl
        shell: bash
        run: |
          git config --global --add safe.directory ${GITHUB_WORKSPACE}
          PATH="/github/home/.local/bin:$PATH"
          ./waf configure --board sitl
          timeout 10 ./waf antennatracker --scripting-docs || code=$?; if [[ $code -ne 124 && $code -ne 0 ]]; then exit $code; fi

      - name: run compare
        run: |
          PATH="/github/home/.local/bin:$PATH"
          python ./libraries/AP_Scripting/tests/docs_check.py "./libraries/AP_Scripting/docs/docs.lua" "./libraries/AP_Scripting/docs/current_docs.lua"

      - name: Upload docs
        uses: actions/upload-artifact@v4
        with:
          name: Docs
          path: ScriptingDocs.md
          retention-days: 7

  test-lte-happy-path:
    runs-on: ubuntu-22.04
    container: ardupilot/ardupilot-dev-base:v0.1.3
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install LTE Test Dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y socat python3-serial
          pip install pyserial pymavlink MAVProxy empy==3.3.4 --break-system-packages 2>/dev/null \
            || pip install pyserial pymavlink MAVProxy empy==3.3.4

      - name: Setup Virtual Serial Cable
        shell: bash
        run: |
          socat -d -d PTY,link=/tmp/ttyMock,raw,echo=0 PTY,link=/tmp/ttySITL,raw,echo=0 &
          sleep 1
          chmod 777 /tmp/ttyMock /tmp/ttySITL

      - name: Build ArduPlane SITL
        shell: bash
        run: |
          git config --global --add safe.directory ${GITHUB_WORKSPACE}
          PATH="/github/home/.local/bin:$PATH"
          ./waf configure --board sitl
          ./waf plane

      - name: Configure Parameters
        shell: bash
        run: |
          # AP_LTE is compiled into the firmware, so none of the Lua staging
          # this job used to do applies: no script copy, no CMUX/NOMUX seds, no
          # SCR_* heap or simulated-device setup. LTE_* are ordinary parameters
          # now, so a defaults file actually sets them.
          #
          # LTE_HTTPAUTH is 0 here. The HTTPS login reads the craft ID and
          # password out of AP_CustomStorage, which is only compiled in behind
          # --enable-custom-storage and has to be provisioned over the custom
          # AIRBOUND_PARAMETER_GETSET message. Neither is set up in CI, so with
          # HTTPAUTH on the driver halts before it opens a socket -- exactly as
          # the Lua applet did. Until provisioning is wired up here this job
          # verifies the static-address path all the way to CONNECTED.
          # Two configurations, differing only in LTE_OPTIONS: bit 2 is NoMux.
          # 6 = Signals|NoMux runs the plain transparent path; 2 = Signals
          # leaves CMUX on, so the whole AT exchange is GSM 07.10 framed and
          # the socket rides DLC 2. The mock speaks both.
          cat <<'EOF' > lte_common.parm
          LTE_ENABLE 1
          LTE_SERPORT 0
          SERIAL1_PROTOCOL 28
          LTE_PROTOCOL 2
          LTE_HTTPAUTH 0
          LTE_SERVER_IP0 8
          LTE_SERVER_IP1 8
          LTE_SERVER_IP2 8
          LTE_SERVER_IP3 8
          LTE_SERVER_PORT 8080
          EOF
          cp lte_common.parm lte_nomux.parm
          echo "LTE_OPTIONS 6" >> lte_nomux.parm
          cp lte_common.parm lte_cmux.parm
          echo "LTE_OPTIONS 2" >> lte_cmux.parm

      - name: "LTE Happy Path: Boot SITL and Verify"
        shell: bash
        run: |
          export PATH="/github/home/.local/bin:$PATH:$GITHUB_WORKSPACE/Tools/autotest"

          OVERALL=0
          for cfg in nomux cmux; do
            echo "=================== $cfg ==================="

            # 14551 = STATUSTEXT monitoring, 14552 = param injection
            python3 Tools/autotest/Lte_modem_test.py \
              --port /tmp/ttyMock \
              --mavlink-port 14551 \
              --inject-port 14552 \
              --no-httpauth \
              --timeout 120 &
            TEST_PID=$!
            sleep 2

            sim_vehicle.py -v ArduPlane --no-rebuild \
              --add-param-file "lte_$cfg.parm" \
              -A "--serial1=uart:/tmp/ttySITL" \
              --out 127.0.0.1:14551 \
              --out 127.0.0.1:14552 \
              --mavproxy-args="--daemon" &
            SITL_PID=$!

            wait $TEST_PID
            RESULT=$?

            kill -9 $SITL_PID || true
            killall -9 arduplane || true
            sleep 3

            if [ $RESULT -ne 0 ]; then
              echo "::error::LTE happy path failed for $cfg"
              OVERALL=$RESULT
            fi
            # A saved eeprom.bin would carry LTE_OPTIONS into the next
            # configuration and silently run it twice.
            rm -f eeprom.bin
          done
          exit $OVERALL