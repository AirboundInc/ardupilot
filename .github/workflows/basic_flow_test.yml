name: LTE Modem Basic Flow Check

on:
  push:
    branches: [ master, main, lte-automated-tests ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  test_happy_path:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y socat python3-serial python3-pip python3-dev python3-future
        pip install pyserial pymavlink MAVProxy empy==3.3.4 --break-system-packages

    - name: Setup Virtual Serial Cable
      run: |
        socat -d -d PTY,link=/tmp/ttyMock,raw,echo=0 PTY,link=/tmp/ttySITL,raw,echo=0 &
        sleep 1
        chmod 777 /tmp/ttyMock /tmp/ttySITL

    - name: Build ArduPlane SITL
      run: |
        ./waf configure --board sitl
        ./waf plane

    - name: Configure Parameters & Load Script
      run: |
        mkdir -p scripts
        cp libraries/AP_HAL_ChibiOS/hwdef/Pixhawk6C-bdshot/scripts/LTE_modem.lua scripts/
        mkdir -p ArduPlane/scripts
        cp libraries/AP_HAL_ChibiOS/hwdef/Pixhawk6C-bdshot/scripts/LTE_modem.lua ArduPlane/scripts/
        
        # --- Surgically bypass CMUX transitions for the Python mock ---
        sed -i 's/step = "CMUX"/step = "CPIN"/g' scripts/LTE_modem.lua
        sed -i "s/step = 'CMUX'/step = 'CPIN'/g" scripts/LTE_modem.lua
        sed -i 's/step = "CMUX"/step = "CPIN"/g' ArduPlane/scripts/LTE_modem.lua
        sed -i "s/step = 'CMUX'/step = 'CPIN'/g" ArduPlane/scripts/LTE_modem.lua
        
        # --- Create Parameter File using Absolute Paths ---
        cat <<EOF > $GITHUB_WORKSPACE/lte_test.parm
        SCR_ENABLE 1
        LTE_ENABLE 1
        LTE_SERPORT 0
        SERIAL1_PROTOCOL 28
        SCR_SDEV_EN 1
        SCR_SDEV1_PROTO 2
        LTE_PROTOCOL 2
        LTE_SCRPORT 0
        LTE_OPTIONS 4
        LTE_SERVER_PORT 8080
        LTE_SERVER_IP0 8
        LTE_SERVER_IP1 8
        LTE_SERVER_IP2 8
        LTE_SERVER_IP3 8
        EOF
        
        # --- Create MAVProxy Startup Script to delay parameter loading ---
        cat <<EOF > $GITHUB_WORKSPACE/mavinit.scr
        module load system
        ! sleep 5
        param load $GITHUB_WORKSPACE/lte_test.parm
        EOF
        # Copy to ArduPlane directory as well to ensure MAVProxy finds it
        cp $GITHUB_WORKSPACE/mavinit.scr $GITHUB_WORKSPACE/ArduPlane/mavinit.scr

    - name: Boot SITL and Run Basic Flow Test
      run: |
        export PATH=$PATH:$GITHUB_WORKSPACE/Tools/autotest
        
        # --- BOOT 1: Initialize Lua Parameters in EEPROM ---
        echo "Running Boot 1 to register Lua parameters..."
        sim_vehicle.py -v ArduPlane --no-rebuild \
          --add-param-file lte_test.parm \
          -A "--serial1=uart:/tmp/ttySITL" \
          --mavproxy-args="--daemon" &
        BOOT1_PID=$!
        
        # Give Lua 15 seconds to boot and write parameter definitions to memory
        sleep 15
        kill -9 $BOOT1_PID || true
        killall -9 arduplane || true
        sleep 2
        
        # Flush stale serial data from Boot 1
        dd if=/tmp/ttyMock of=/dev/null bs=4096 count=1 iflag=nonblock 2>/dev/null || true
        dd if=/tmp/ttySITL of=/dev/null bs=4096 count=1 iflag=nonblock 2>/dev/null || true
        
        # --- START PYTHON MOCK ---
        python3 Tools/autotest/Lte_modem_test.py --port /tmp/ttyMock --mavlink-port 14551 &
        TEST_PID=$!
        sleep 2
        
        # --- BOOT 2: Run the Actual Test ---
        echo "Running Boot 2 to execute the test..."
        sim_vehicle.py -v ArduPlane --no-rebuild \
          --add-param-file lte_test.parm \
          -A "--serial1=uart:/tmp/ttySITL" \
          --out 127.0.0.1:14551 \
          --mavproxy-args="--daemon" &
        SITL_PID=$!
        
        wait $TEST_PID
        RESULT=$?
        
        kill -9 $SITL_PID || true
        killall -9 arduplane || true
        exit $RESULT