name: LTE Modem Basic Flow Check

on:
  push:
    branches: [ master, main, lte-automated-tests ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  test_happy_path:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'    # <-- Add this line to fetch waf and other dependencies

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y socat python3-serial python3-pip python3-dev python3-future
        # Added empy==3.3.4 to fix the waf build error
        pip install pyserial pymavlink MAVProxy empy==3.3.4 --break-system-packages

    - name: Setup Virtual Serial Cable
      run: |
        socat -d -d PTY,link=/tmp/ttyMock,raw,echo=0 PTY,link=/tmp/ttySITL,raw,echo=0 &
        sleep 1
        chmod 777 /tmp/ttyMock /tmp/ttySITL

    - name: Build ArduPlane SITL
      run: |
        ./waf configure --board sitl
        ./waf plane

    - name: Configure Parameters & Load Script
      run: |
        mkdir -p ArduPlane/AP_Scripting/scripts
        cp libraries/AP_HAL_ChibiOS/hwdef/Pixhawk6C-bdshot/scripts/LTE_modem.lua ArduPlane/AP_Scripting/scripts/
        
        # Load script enabling and port configurations
        echo "SCR_ENABLE 1" >> Tools/autotest/default_params/plane.parm
        echo "LTE_ENABLE 1" >> Tools/autotest/default_params/plane.parm
        echo "LTE_SERPORT 1" >> Tools/autotest/default_params/plane.parm
        echo "SERIAL1_PROTOCOL 28" >> Tools/autotest/default_params/plane.parm
        echo "LTE_OPTIONS 4" >> Tools/autotest/default_params/plane.parm
        
        # IP/Port Configurations required to prevent early-return timeout
        echo "LTE_SERVER_PORT 8080" >> Tools/autotest/default_params/plane.parm
        echo "LTE_SERVER_IP0 8" >> Tools/autotest/default_params/plane.parm
        echo "LTE_SERVER_IP1 8" >> Tools/autotest/default_params/plane.parm
        echo "LTE_SERVER_IP2 8" >> Tools/autotest/default_params/plane.parm
        echo "LTE_SERVER_IP3 8" >> Tools/autotest/default_params/plane.parm

    - name: Boot SITL and Run Basic Flow Test
      run: |
        export PATH=$PATH:$GITHUB_WORKSPACE/Tools/autotest
        
        sim_vehicle.py -v ArduPlane --no-rebuild --no-mavproxy \
          -A "--serial1=uart:/tmp/ttySITL" \
          --out udp:localhost:14551 &
        
        sleep 10
        
        # Executing exact filename with capital L
        python3 Tools/autotest/Lte_modem_test.py --port /tmp/ttyMock --mavlink-port 14551